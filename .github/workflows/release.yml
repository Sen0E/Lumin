name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.13.2 (must match mygo.json)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '0'
  PYTHON: python
  PYTHONUTF8: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/release.py metadata --tag "$RELEASE_TAG"

  check:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Check source and release tooling
        run: |
          go test ./...
          go vet ./...
          go tool mygo vet .
          python -m unittest discover -s scripts -p 'test_*.py' -v
          bash -n scripts/build-release.sh scripts/build-plugins.sh
          git diff --exit-code -- go.mod go.sum

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
          - runner: windows-2025
            target: windows/amd64
            artifact: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build application and both plugins
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/build-release.sh "$RELEASE_TARGET"
      - name: Test release tooling and both native plugins
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          caiyun_ref="$(python scripts/release.py plugin-ref --plugin caiyun)"
          host_target="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          if [[ "$host_target" == "$RELEASE_TARGET" ]]; then
            export LUMIN_PPOCR_PACKAGE="$GITHUB_WORKSPACE/resources/${RELEASE_TARGET/\//-}/bundled-ocr.luminext"
            export LUMIN_TEST_CAIYUN_PACKAGE="$GITHUB_WORKSPACE/build/plugins/$caiyun_ref-${RELEASE_TARGET/\//-}.luminext"
          else
            echo "Unsupported host/target test combination: $host_target -> $RELEASE_TARGET" >&2
            exit 1
          fi
          python -m unittest discover -s scripts -p 'test_*.py' -v
          go test ./cmd/lumin-plugin-pack ./internal/ocrsetup ./plugins/ppocrv6-tiny ./internal/plugin -count=1
          python scripts/release.py collect --target "$RELEASE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [prepare, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Check complete asset set and generate checksums
        run: |
          python scripts/release.py finalize --notes "$RUNNER_TEMP/release-notes.md"
      - name: Publish complete GitHub Release
        run: |
          set -euo pipefail
          flags=()
          if [[ "$IS_PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$state" != true ]]; then
              echo 'This release is already published. Refusing to overwrite published assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Lumin $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false \
            --title "Lumin $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
